<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }

    /* Loading screen, same as the main ITinder app (#veil in app/web/index.html).
       Shown from the first paint, hidden by UI/components/LoadingScreen.tsx */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #14110f;
      transition: opacity 1.4s ease;
    }

    #veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    #veil .bar {
      width: min(240px, 60vw);
      height: 2px;
      background: rgba(237, 237, 237, .12);
      overflow: hidden;
    }

    #veil .bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: #402FFF;
      animation: veil-run 1.1s ease-in-out infinite;
    }

    @keyframes veil-run {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    #veil .error {
      display: none;
      max-width: calc(100vw - 32px);
      padding: 12px 14px;
      border-left: 3px solid #EC1D35;
      background: #1B1C21;
      color: #EDEDED;
    }

    #veil.no-webgl .bar {
      display: none;
    }

    #veil.no-webgl .error {
      display: block;
    }
  </style>
